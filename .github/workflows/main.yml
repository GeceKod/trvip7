name: Auto Update M3U8 Playlists

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scrapers:
    runs-on: ubuntu-latest

    steps:
      # 1. Kaynak kodları çek (yetki çakışmasını engellemek için persist-credentials: false)
      - name: Checkout Source (trvip7)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 2. Python ve Playwright kurulumu
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      # 3. Scraper'ı çalıştır ve kanallar7.m3u8 dosyasını üret
      - name: Run Scraper
        run: |
          if [ -f mahsun_downloader.py ]; then
            python mahsun_downloader.py
          elif [ -f main.py ]; then
            python main.py
          fi

      # 4. GeceKod/listeler reposunu PAT_TOKEN ile resmi olarak bağla
      - name: Checkout Target Repo (GeceKod/listeler)
        uses: actions/checkout@v4
        with:
          repository: 'GeceKod/listeler'
          token: ${{ secrets.PAT_TOKEN }}
          path: 'listeler_repo'
          persist-credentials: true

      # 5. Dosyayı listeler_repo içine kopyala ve pushla
      - name: Commit and Push to GeceKod/listeler
        run: |
          if [ -f kanallar7.m3u8 ]; then
            cp kanallar7.m3u8 listeler_repo/kanallar7.m3u8
          elif [ -f kanallar_mahsun.m3u8 ]; then
            cp kanallar_mahsun.m3u8 listeler_repo/kanallar7.m3u8
          fi

          cd listeler_repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kanallar7.m3u8
          git commit -m "🤖 Auto Update: kanallar7.m3u8 updated" || echo "Değişiklik yok"
          git push origin main
