name: Auto Update M3U8 Playlists

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scrapers:
    runs-on: ubuntu-latest

    steps:
      - name: Codebase Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Taraftarium Scraper
        run: |
          if [ -f main.py ]; then
            python main.py
          fi

      - name: Run Mahsun Sports Scraper
        run: |
          if [ -f mahsun_downloader.py ]; then
            python mahsun_downloader.py
          fi

      - name: Commit and Push Updated M3U8 Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto Update: M3U8 Playlists Updated"
          file_pattern: "*.m3u8"

      # Ekran görüntüsü ve HTML dosyasını GitHub arayüzüne yükler
      - name: Upload Debug Artifacts (Screenshot & HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            debug_screenshot.png
            debug_page.html
          if-no-files-found: ignore
