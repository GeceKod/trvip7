name: Auto Update M3U8 Playlists

on:
  schedule:
    # Her 6 saatte bir otomatik çalışır
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scrapers:
    runs-on: ubuntu-latest

    steps:
      - name: Codebase Checkout (trvip7)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      # 1. Scraper'ı çalıştır ve kanallar7.m3u8 üret
      - name: Run Scraper
        run: |
          if [ -f mahsun_downloader.py ]; then
            python mahsun_downloader.py
          elif [ -f main.py ]; then
            python main.py
          fi

      # 2. Dosyayı doğrudan GeceKod/listeler reposuna yükle
      - name: Push to GeceKod/listeler
        env:
          TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # listeler reposunu klonla
          git clone https://x-access-token:${TOKEN}@github.com/GeceKod/listeler.git listeler_repo

          # Üretilen dosyayı listeler reposuna kopyala
          if [ -f kanallar7.m3u8 ]; then
            cp kanallar7.m3u8 listeler_repo/kanallar7.m3u8
          elif [ -f kanallar_mahsun.m3u8 ]; then
            cp kanallar_mahsun.m3u8 listeler_repo/kanallar7.m3u8
          fi

          # listeler reposuna commit ve push yap
          cd listeler_repo
          git add kanallar7.m3u8
          git commit -m "🤖 Auto Update: kanallar7.m3u8 updated" || echo "Değişiklik yok"
          git push origin main
